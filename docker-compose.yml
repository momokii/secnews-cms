# SecNews CMS — base service definitions (postgres pinned, api).
# Dev conveniences live in docker-compose.override.yml (auto-merged).
# Images are pinned to exact tags — never use `latest` or floating majors here.
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      # Dev defaults; production must override via real .env values.
      POSTGRES_USER: ${POSTGRES_USER:-secnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secnews_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-secnews_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app
    # Public DNS: the host stub resolver answers Google hosts with
    # IPv6-only records on networks without IPv6 egress, which wedges
    # AI provider calls (ETIMEDOUT). Scoped to this service on purpose.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Inside the compose network the DB hostname is `db`, not localhost.
      DATABASE_URL: ${DATABASE_URL:-postgresql://secnews:secnews_dev_password@db:5432/secnews_dev}
      # Dev-only placeholder; production .env must supply a real secret.
      JWT_SECRET: ${JWT_SECRET:-replace-me-in-real-env}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm ci && npm run dev"

volumes:
  pgdata:
